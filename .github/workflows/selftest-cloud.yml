name: Selftest (cloud HIL)

# Runs the STM32 selftest on the physical device registered as "benchpod-v1.0.0",
# driven over embeddedci.com from pytest (no BenchPod on the runner). Auth is the
# job's GitHub OIDC token — no secret needed (the repo must be trusted in the
# EmbeddedCI web app under BenchPod → GitHub Actions, allowed to drive the device).
#
# Triggers only when the firmware (selftest.c) or this workflow changes.
on:
  push:
    paths:
      - "selftest-stm32/selftest.c"
      - "selftest-stm32/tests/**"
      - ".github/workflows/selftest-cloud.yml"
  workflow_dispatch: {}

permissions:
  id-token: write   # REQUIRED: lets the job mint a GitHub OIDC token for embeddedci
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # --- Build the firmware (arm-none-eabi + STM32CubeF4 HAL) ---
      - name: Install ARM toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: "13.2.Rel1"   # official Arm GNU toolchain, pinned + cached across runs

      - name: Install xPack OpenOCD
        # OpenOCD runs on the runner: the SDK drives the pod's on-board CMSIS-DAP probe through
        # OpenOCD's cmsis-dap adapter with its TCP backend (cmsis_dap_tcp), bridged through the
        # cloud tunnel to the device. That backend is newer than OpenOCD 0.12.0 — Ubuntu's apt
        # openocd 0.12.0 lacks it (the SDK fails up front with a clear message). xPack OpenOCD
        # ships a post-0.12.0 master snapshot that has it.
        run: |
          V=0.12.0-7
          curl -fsSL "https://github.com/xpack-dev-tools/openocd-xpack/releases/download/v$V/xpack-openocd-$V-linux-x64.tar.gz" \
            | sudo tar xz -C /opt
          echo "/opt/xpack-openocd-$V/bin" >> "$GITHUB_PATH"

      - name: Fetch STM32CubeF4 HAL
        # The HAL driver and the CMSIS device headers are git SUBMODULES of STM32CubeF4 (separate
        # repos), so a plain clone leaves them empty. Sparse-checkout just Drivers/CMSIS (for the
        # core CMSIS Include/), then init only the two submodules the Makefile actually needs —
        # avoids pulling the huge Projects/ and the dozens of BSP/Middleware submodules.
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/STMicroelectronics/STM32CubeF4 selftest-stm32/STM32CubeF4
          cd selftest-stm32/STM32CubeF4
          git sparse-checkout set Drivers/CMSIS
          git submodule update --init --depth 1 \
            Drivers/STM32F4xx_HAL_Driver Drivers/CMSIS/Device/ST/STM32F4xx

      - name: Build selftest.elf
        run: make -C selftest-stm32 CUBE_F4="$GITHUB_WORKSPACE/selftest-stm32/STM32CubeF4"

      # --- Run it on benchpod-v1.0.0 over the cloud ---
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the embeddedci SDK (cloud + pytest extras)
        # Pinned to the frozen 2.x API. The [pytest] extra pulls in pytest (the SDK is a pytest
        # *plugin*, pytest is not a runtime dep); [cloud] adds the embeddedci.com transport.
        run: pip install "embeddedci[cloud,pytest]>=2.0,<3"

      - name: Self-test on benchpod-v1.0.0 (cloud)
        # The test requests the `build_report` fixture, so this run is also recorded on
        # embeddedci.com as a GitHub-sourced build: the firmware (elf/bin/hex) is uploaded and the
        # pytest pass/fail is captured, reusing the same OIDC token (id-token: write above). The
        # uploaded firmware can then be re-flashed from the BenchPod page in the web UI.
        # --benchpod-build-target labels the build's platform for the flash modal.
        # The LA bank voltage (3.3 V for the STM32) is set in selftest-stm32/tests/conftest.py.
        run: |
          pytest selftest-stm32/tests -v \
            --benchpod-connection=embeddedci:benchpod-v1.0.0 \
            --benchpod-firmware="$GITHUB_WORKSPACE/selftest-stm32/build/selftest.elf" \
            --benchpod-build-target=stm32f4

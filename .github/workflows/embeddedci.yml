name: EmbeddedCI
on:
  workflow_dispatch:
#  push:
#    paths:
#      - "scenario-sensors-stm32/**"
#      - ".github/workflows/embeddedci.yml"

jobs:
  submit:
    # Pinned to ubuntu-24.04: ubuntu-latest moves to Ubuntu 26 from 2026-10-19. Unpin once 26.04 is verified.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - name: Submit job to EmbeddedCI
        uses: embeddedci-com/submit-job-action@main
        with:
          api_url: ${{ secrets.EMBEDDEDCI_API_URL }}
          api_key: ${{ secrets.EMBEDDEDCI_API_KEY }}
          source_path: scenario-sensors-stm32
          ref: ${{ github.ref }}
          commit: ${{ github.sha }}


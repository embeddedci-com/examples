version: 1
name: stm32 example with scenario
builds:
  example-build:
    targets:
      - id: nucleo-f446re
    packs:
      - id: firmware/stm32-build
        config:
          build_system: make
          cmd: make -j$(nproc)
          artifact_elf: build/scenario-sensors.elf
          artifact_bin: build/scenario-sensors.bin
          artifact_hex: build/scenario-sensors.hex
          toolchain: arm-none-eabi
      - id: test/hardware
        config:
          platform: nucleo-f446re
          success_pattern: "stm32 bmp280"

scenarios:
  # Built-in scenario: drone altitude HIL (registry profile + adapter wiring).
  drone-altitude-basic:
    description: "Single rotor lift affects altitude via simulated BMP280 pressure"

    registry_scenario: scenarios/drone-altitude-basic.yaml

    gpio_bindings:
      rotor_enable:
        gpio: 16

    environment:
      simulators:
        - id: altimeter
          device: devices/i2c/sensors/bmp280.yaml
          bus: i2c1
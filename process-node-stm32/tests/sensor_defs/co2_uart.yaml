format: 1
kind: uart
name: co2_uart
label: "Test part: an MH-Z19-like CO2 sensor (request and answer)"
description: |
  9600 8N1. The read command FF 01 86 00 00 00 00 00 79 answers FF 86 <ppm hi> <ppm lo>
  <temperature + 40> 00 00 00 <checksum>, where the checksum is 0xFF minus the sum of bytes 1..7,
  plus 1. A text request "READ?" answers "CO2=<ppm>". Test-only.
version: 1.0.0
license: Apache-2.0

params:
  - { key: co2_ppm, unit: ppm, min: 0, max: 5000, default: 450 }
  - { key: temperature_c, unit: C, min: -40, max: 85, default: 24 }

uart: { baud: 9600, format: 8N1 }

functions:
  checksum:
    args: [a, b, c]
    return: "u8(0xFF - u8(0x86 + a + b + c) + 1)"

let:
  - hi: "byte(co2_ppm, 1)"
  - lo: "byte(co2_ppm, 0)"
  - tb: "u8(temperature_c + 40)"

requests:
  - match: [0xFF, 0x01, 0x86, 0x00, 0x00, 0x00, 0x00, 0x00, 0x79]
    answer: [0xFF, 0x86, "hi", "lo", "tb", 0, 0, 0, "checksum(hi, lo, tb)"]
    delay_ms: 10
  - match_line: "READ?"
    text: "CO2={co2_ppm:d}"
    end: crlf
